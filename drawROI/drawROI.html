<div class="wrapper">
    <div class="toolbar">
        <div class="toolbar-row">
            <div class="toolbar-left toolbar-panel panel-actions">
                <button class="tb-btn btn-save" data-tip="Save" mat-button color="primary" (click)="savePolygon()">Save</button>
                <button class="tb-btn btn-undo" data-tip="Undo" mat-button (click)="undoPoint()">Undo</button>
                <button class="tb-btn btn-clear" data-tip="Delete" mat-button (click)="clearAll()">Clear</button>
                <button class="tb-btn btn-reload" data-tip="Reload" mat-button (click)="reloadSaved()">Reload</button>
            </div>

            <div class="flow-legend toolbar-panel panel-legend" data-mode="tablet">
                <span class="flow-item flow-pass">
                    <span class="flow-icon flow-icon-tablet">
                        <span class="flow-arrow"></span>
                    </span>
                    <span class="flow-icon flow-icon-edge">
                        <span class="flow-box flow-green"></span>
                        <span class="flow-link">&#8594;</span>
                        <span class="flow-box flow-red"></span>
                    </span>
                    <span class="legend-pass-label">Pass</span>
                </span>
                <span class="flow-item flow-out">
                    <span class="flow-icon flow-icon-tablet">
                        <span class="flow-arrow"></span>
                    </span>
                    <span class="flow-icon flow-icon-edge">
                        <span class="flow-box flow-red"></span>
                        <span class="flow-link">&#8594;</span>
                        <span class="flow-box flow-green"></span>
                    </span>
                    <span class="legend-out-label">Exit</span>
                </span>
            </div>

            <div class="toolbar-right">
                <div class="cam-box toolbar-panel panel-camera">
                    <label class="cam-label">Camera</label>
                    <select class="cam-dd"></select>
                </div>

                <div class="roi-switch toolbar-panel panel-roi">
                    <button class="roi-btn active" data-roi="Detect">Detect</button>
                    <button class="roi-btn" data-roi="Region1">Region1</button>
                    <button class="roi-btn" data-roi="Region2">Region2</button>
                </div>
            </div>
        </div>
    </div>

    <div class="stage">
        <canvas></canvas>

        <!-- Loading overlay -->
        <div class="loading-overlay">
            <div class="loading-card">
                <div class="spinner"></div>
                <div class="loading-text">Loading latest frame...</div>
            </div>
        </div>

        <div class="roi-hint">Draw ROI with 4 points, then click red edge to set counting line.</div>

        <div class="toast-center"></div>
    </div>

</div>
