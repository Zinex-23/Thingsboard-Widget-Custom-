<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Heatmap Preview</title>
  <link rel="stylesheet" href="./heatmap.css" />
  <style>
    body {
      margin: 0;
      background: #f8fafc;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }

    .preview-wrap {
      max-width: 1200px;
      margin: 24px auto;
      padding: 16px;
    }

    #eh2-root {
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 14px 38px rgba(15, 23, 42, 0.08);
      padding: 16px;
      height: 520px;
    }
  </style>
</head>

<body>
  <div class="preview-wrap">
    <!-- include widget HTML -->
    <div id="eh2-root" data-theme="light">
      <div class="eh-card">
        <div id="eh2-header" class="eh-header">
          <div class="eh-btn-group" id="eh2-range-group">
            <button class="eh-btn eh-btn--chip" data-range="1d">Last 24 Hours</button>
            <button class="eh-btn eh-btn--chip active" data-range="1w">Last 7 Days</button>
            <button class="eh-btn eh-btn--chip" data-range="1m">Last 30 Days</button>
            <button class="eh-btn eh-btn--chip" data-range="custom">Custom</button>
          </div>
          <div class="eh-btn-group" id="eh2-hour-mode-group">
            <button class="eh-btn eh-btn--chip active" id="eh2-hour-toggle" data-hour-mode="10h">
              <span class="eh-btn-text">Business Hours</span>
              <svg class="eh-switch-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <path d="M16 3L20 7L16 11M20 7H4M8 21L4 17L8 13M4 17H20" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>

            <div class="eh-btn-group" id="eh2-view-group">
              <button class="eh-btn eh-btn--expand-icon" id="eh2-expand-toggle" type="button" aria-label="Expand fullscreen">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M8 3H3V8M16 3H21V8M21 16V21H16M3 16V21H8" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
          </div>
          <div id="eh2-expanded-toolbar" class="eh-expanded-toolbar" aria-hidden="true">
            <button class="eh-expanded-close" id="eh2-expanded-close" type="button">Collapse</button>
          </div>
          <div id="eh2-expanded-scrollbar" class="eh-expanded-scrollbar" aria-hidden="true">
            <input id="eh2-expanded-scroll-input" class="eh-expanded-scroll-input" type="range" min="0" max="0" value="0" step="1" />
          </div>
          <div id="eh2-key-wrap" class="eh-key-wrap" style="display:none;">
            <span class="eh-label">Customer:</span>
            <div class="eh-dropdown">
              <button id="eh2-key-trigger" class="eh-dropdown-trigger">
                <span id="eh2-key-label">Select</span>
                <svg class="eh-arrow" width="10" height="6" viewBox="0 0 10 6" fill="none">
                  <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round" />
                </svg>
              </button>
              <div id="eh2-key-menu" class="eh-dropdown-menu"></div>
            </div>
          </div>
        </div>
        <div id="eh2-mobile-note" class="eh-mobile-note">
          Swipe to view the full heatmap. Tap a cell to see details.
        </div>
        <div class="eh-scroll-wrap">
          <canvas id="eh2-canvas" class="eh-canvas" aria-label="Energy heatmap"></canvas>
          <div id="eh2-mobile-board" class="eh-mobile-board" aria-label="Mobile heatmap view"></div>
        </div>
        <div id="eh2-legend" class="eh-legend"></div>
        <div id="eh2-mobile-detail" class="eh-mobile-detail"></div>
        <div id="eh2-tooltip" class="eh-tooltip" style="display:none"></div>
      </div>
    </div>
  </div>

  <script>
    // Mock data generator for preview
    (function () {
      function startOfDay(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
      function rand(seed) { return Math.sin(seed) * 10000 - Math.floor(Math.sin(seed) * 10000); }

      var now = new Date();
      var start = startOfDay(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 6));
      var end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);

      function makeSeries(mult, noise) {
        var out = [];
        var seed = 1;
        for (var d = 0; d < 7; d++) {
          for (var h = 0; h < 24; h++) {
            // focus on business hours with a midday peak
            var peak = Math.exp(-Math.pow((h - 13) / 4, 2));
            var base = (h >= 7 && h <= 19) ? (40 + 260 * peak) : 10;
            var n = (rand(seed++) - 0.5) * noise;
            var v = Math.max(0, Math.round((base + n) * mult));
            if (v === 0 && rand(seed++) < 0.3) continue; // sparse data
            var ts = new Date(start.getTime() + d * 86400000 + h * 3600000).getTime();
            out.push([ts, v]);
          }
        }
        return out;
      }

      window.self = window.self || {};
      window.self.ctx = {
        data: [
          { dataKey: { name: "paymented_total", label: "Approach" }, data: makeSeries(1.0, 60) },
          { dataKey: { name: "watching_total", label: "Watching" }, data: makeSeries(0.8, 50) },
          { dataKey: { name: "pass_total", label: "Pass" }, data: makeSeries(1.5, 90) }
        ],
        datasources: [
          {
            dataKeys: [
              { name: "paymented_total", label: "Approach" },
              { name: "watching_total", label: "Watching" },
              { name: "pass_total", label: "Pass" }
            ]
          }
        ],
        $container: [document.getElementById("eh2-root")]
      };
    })();
  </script>
  <script src="./heatmap.js"></script>
</body>

</html>
